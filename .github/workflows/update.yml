name: 영상 목록 갱신

on:
  schedule:
    - cron: '17 */6 * * *'   # 6시간마다 (한국 시간 3·9·15·21시 17분) — 매시간 호출하면 Meta가 비정상 활동으로 막을 수 있다
  workflow_dispatch:       # Actions 탭에서 "지금 갱신" 버튼
  push:
    branches: [main]
    paths-ignore: ['site/data/**', 'site/thumbs/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: 영상 수집
        run: node scripts/build-feed.mjs
        env:
          IG_TOKEN_MAIN: ${{ secrets.IG_TOKEN_MAIN }}
          IG_TOKEN_MILO: ${{ secrets.IG_TOKEN_MILO }}
          FB_PAGE_TOKEN_1: ${{ secrets.FB_PAGE_TOKEN_1 }}
          FB_PAGE_TOKEN_2: ${{ secrets.FB_PAGE_TOKEN_2 }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      - name: 바뀐 목록 저장
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add site/data site/thumbs
          git diff --cached --quiet || (git commit -m "영상 목록 갱신" && (git push || (git pull --rebase -X theirs && git push)))
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
